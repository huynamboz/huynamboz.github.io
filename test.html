<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric.js Drag to Create Triangle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.2.4/fabric.min.js"></script>
    <style>
        canvas {
            border: 1px solid #ccc;
        }
        .controls {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="toggle-draw">Toggle Draw Mode</button>
    </div>
    <canvas id="canvas" width="800" height="500"></canvas>

    <script>
        const canvas = new fabric.Canvas('canvas');
        let isDrawingMode = false; // Trạng thái bật/tắt chế độ vẽ
        let isDrawing = false; // Đang vẽ tam giác
        let startX, startY;
        let triangle;

        // Toggle chế độ vẽ
        const toggleButton = document.getElementById('toggle-draw');
        toggleButton.addEventListener('click', () => {
            isDrawingMode = !isDrawingMode;

            // Kích hoạt hoặc vô hiệu hóa selectability
            canvas.selection = !isDrawingMode;
            canvas.forEachObject(obj => {
              console.log("Object", obj);
                obj.selectable = !isDrawingMode;
                obj.evented = !isDrawingMode;
            });

            canvas.renderAll(); // Cập nhật canvas

            toggleButton.textContent = isDrawingMode ? "Draw Mode: ON" : "Draw Mode: OFF";
        });

        // Xử lý sự kiện khi nhấn chuột
        canvas.on('mouse:down', function (options) {
          console.log("Mouse down", isDrawing, isDrawingMode);
            if (!isDrawingMode) return;

            isDrawing = true;
            const pointer = canvas.getPointer(options.e);
            startX = pointer.x;
            startY = pointer.y;

            triangle = new fabric.Triangle({
                left: startX,
                top: startY,
                width: 0,
                height: 0,
                fill: 'rgba(0, 0, 255, 0.5)',
                selectable: false,
                evented: false, // Tắt sự kiện trong khi vẽ
            });

            canvas.add(triangle);
        });

        // Xử lý sự kiện khi kéo chuột
        canvas.on('mouse:move', function (options) {
            if (!isDrawing) return;

            const pointer = canvas.getPointer(options.e);
            const width = pointer.x - startX;
            const height = pointer.y - startY;

            triangle.set({
                width: Math.abs(width),
                height: Math.abs(height),
                left: width < 0 ? startX + width : startX,
                top: height < 0 ? startY + height : startY,
            });

            canvas.renderAll();
        });

        // Xử lý sự kiện khi thả chuột
        canvas.on('mouse:up', function () {
          console.log("Mouse up", isDrawing);
            if (!isDrawing) return;
            isDrawing = false;

            // Kích hoạt selectability cho tam giác mới
            triangle.set({
                selectable: true,
                evented: true,
            });

            canvas.renderAll();
        });

        // Log sự kiện chọn đối tượng
        canvas.on('selection:created', function () {
            console.log("Object selected!");
        });
    </script>
</body>
</html>
